<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchorage Suntracker</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 2rem;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; }
    .date { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .section {
      border-top: 1px solid #334155;
      padding-top: 1rem;
      margin-top: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .metric-label { font-size: 0.8rem; color: #94a3b8; }
    .metric-val { font-size: 1.1rem; font-weight: bold; margin-top: 0.2rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Anchorage, AK Suntracker</h1>
    <div id="current-date" class="date">Loading date...</div>

    <div class="section">
      <h3>Weather</h3>
      <div class="grid">
        <div>
          <div class="metric-label">High / Low</div>
          <div id="temp" class="metric-val">-- / --</div>
        </div>
        <div>
          <div class="metric-label">Conditions</div>
          <div id="conditions" class="metric-val">Loading...</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Celestial Data</h3>
      <div class="grid">
        <div>
          <div class="metric-label">Sunrise</div>
          <div id="sunrise" class="metric-val">--</div>
        </div>
        <div>
          <div class="metric-label">Sunset</div>
          <div id="sunset" class="metric-val">--</div>
        </div>
        <div>
          <div class="metric-label">Moon Phase</div>
          <div id="moon-phase" class="metric-val">--</div>
        </div>
        <div>
          <div class="metric-label">Illumination</div>
          <div id="moon-illum" class="metric-val">--</div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
